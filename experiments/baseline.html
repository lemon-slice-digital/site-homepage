<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baseline Strike-through Example</title>
<style>
    .strike-through {
        display: inline;
        background-image: linear-gradient(to bottom, transparent 60%, #7ECDF7 60%, #7ECDF7 80%, transparent 80%);
        background-repeat: no-repeat;
        background-size: 100% 100%; /* This adjusts the height of the line to be thicker or thinner */
    }
</style>
</head>
<body>
    <p>This is some text with <span class="strike-through">striking through the text</span> like a marker.</p>
</body>
</html>
