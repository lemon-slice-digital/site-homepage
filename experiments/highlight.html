<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thick Underline Example</title>
<style>
.highlight {
    text-decoration: underline;
    text-decoration-color: yellow; /* Choose your color */
    text-decoration-thickness: 5px; /* Adjust thickness as needed */
}
</style>
</head>
<body>
    <p>This is some text with a <span class="highlight">highlighted text</span> that simulates a text marker.</p>
</body>
</html>
